<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Dhanush Shankar — AI &amp; Security Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#04130d"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".5" r=".45">
      <stop offset="0" stop-color="#00ff88" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <style>
      .edge { stroke: #22d3ee; stroke-opacity: .25; stroke-width: 1.2; }
      .pulse { stroke: #00ff88; stroke-width: 2; stroke-dasharray: 8 220; animation: flow 3.2s linear infinite; }
      .p2 { animation-delay: -1.1s; } .p3 { animation-delay: -2.2s; }
      .node { fill: #030712; stroke: #22d3ee; stroke-width: 2; }
      .hot { fill: #00ff88; animation: blink 2.4s ease-in-out infinite; }
      .h2 { animation-delay: -.8s; } .h3 { animation-delay: -1.6s; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      @keyframes flow { to { stroke-dashoffset: -228; } }
      @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes caret { 50% { opacity: 0; } }
      .caret { animation: caret 1s steps(1) infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="14" fill="none" stroke="#0f766e" stroke-opacity=".6"/>

  <!-- neural network: 3 input, 4 hidden, 4 hidden, 2 output -->
  <g transform="translate(760 40)">
    <g class="edge">
      <path d="M0 50L120 20M0 50L120 90M0 50L120 160M0 50L120 230M0 120L120 20M0 120L120 90M0 120L120 160M0 120L120 230M0 190L120 20M0 190L120 90M0 190L120 160M0 190L120 230"/>
      <path d="M120 20L240 20M120 20L240 90M120 20L240 160M120 90L240 20M120 90L240 90M120 90L240 230M120 160L240 90M120 160L240 160M120 160L240 230M120 230L240 20M120 230L240 160M120 230L240 230"/>
      <path d="M240 20L360 85M240 90L360 85M240 160L360 85M240 230L360 85M240 20L360 165M240 90L360 165M240 160L360 165M240 230L360 165"/>
    </g>
    <path class="pulse" d="M0 50L120 90L240 160L360 85" fill="none"/>
    <path class="pulse p2" d="M0 190L120 20L240 90L360 165" fill="none"/>
    <path class="pulse p3" d="M0 120L120 160L240 230L360 85" fill="none"/>
    <g>
      <circle class="node" cx="0" cy="50" r="9"/><circle class="node" cx="0" cy="120" r="9"/><circle class="node" cx="0" cy="190" r="9"/>
      <circle class="node" cx="120" cy="20" r="9"/><circle class="node" cx="120" cy="90" r="9"/><circle class="node" cx="120" cy="160" r="9"/><circle class="node" cx="120" cy="230" r="9"/>
      <circle class="node" cx="240" cy="20" r="9"/><circle class="node" cx="240" cy="90" r="9"/><circle class="node" cx="240" cy="160" r="9"/><circle class="node" cx="240" cy="230" r="9"/>
      <circle class="node" cx="360" cy="85" r="11"/><circle class="node" cx="360" cy="165" r="11"/>
      <circle class="hot" cx="120" cy="90" r="4"/><circle class="hot h2" cx="240" cy="160" r="4"/><circle class="hot h3" cx="360" cy="85" r="5"/>
      <circle class="hot h2" cx="0" cy="190" r="4"/><circle class="hot h3" cx="120" cy="20" r="4"/><circle class="hot" cx="360" cy="165" r="5"/>
    </g>
    <text class="mono" x="378" y="90" font-size="13" fill="#00ff88">build</text>
    <text class="mono" x="378" y="170" font-size="13" fill="#22d3ee">secure</text>
  </g>

  <text class="mono" x="64" y="78" font-size="16" fill="#22d3ee" letter-spacing="3">&gt; HELLO_WORLD, I AM</text>
  <text x="62" y="146" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="62" font-weight="800" fill="url(#txt)">Dhanush Shankar</text>
  <text class="mono" x="64" y="190" font-size="22" fill="#e2e8f0">AI &amp; Security Engineer</text>
  <text class="mono" x="64" y="226" font-size="15" fill="#94a3b8">LLM agents · MCP · AI red-teaming · pentest tooling</text>
  <text class="mono" x="64" y="270" font-size="14" fill="#00ff88">$ status --open-to AI/ML · Cybersecurity · SDE<tspan class="caret" fill="#00ff88"> ▋</tspan></text>
</svg>
