name: Metrics
on:
  # Run every 12 hours
  schedule: [{cron: "0 */12 * * *"}]
  # Run on push to main
  push: {branches: ["main"]}
  # Run manually
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.MCP_METRICS_TOKEN }}
          # Base
          config_timezone: Asia/Kolkata
          config_display: regular
          base: header, activity, community, repositories, metadata
          # Core metrics
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages.limit: 8
          plugin_languages.sections: most-used
          plugin_languages.colors: github
          plugin_languages.threshold: 1%
          plugin_achievements: yes
          plugin_achievements.threshold: C
          plugin_achievements.secrets: yes
          plugin_achievements.limit: 8
          plugin_habits: yes
          plugin_habits.from: 200
          plugin_habits.days: 14
          plugin_habits.facts: yes
          plugin_habits.charts: yes
          plugin_habits.charts.type: classic
          plugin_code: yes
          plugin_code.languages: python, typescript, javascript
          plugin_code.load: 100
          plugin_followup: yes
          plugin_people: yes
          plugin_people.limit: 24
          plugin_people.size: 28
          plugin_lines: yes
          plugin_reactions: yes
          plugin_reactions.limit: 10