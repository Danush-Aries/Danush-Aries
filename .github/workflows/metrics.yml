name: Metrics
on:
  schedule: [{cron: "0 */6 * * *"}]
  push: {branches: ["main"]}
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      # ---- MAIN CARD: full hacker dashboard ----
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.MCP_METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_affiliations: owner
          config_timezone: Asia/Kolkata
          config_display: regular
          config_order: base.header, base.activity, base.community, plugin.isocalendar, plugin.languages, plugin.reactions, plugin.habits, plugin.people, plugin.code, plugin.followup, plugin.stars, plugin.stargazers
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_colors: "#39d2cf,#E8A24C,#ff6b6b,#5AB0FF,#7CFFB0,#c792ea,#4ec9b0"
          plugin_languages_analysis_timeout: 60
          plugin_achievements: no
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_code: yes
          plugin_code_load: 200
          plugin_code_languages: python, typescript, javascript, go
          plugin_reactions: yes
          plugin_reactions_limit: 8
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_stars: yes
          plugin_stars_limit: 8
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_lines: yes

      # ---- 2: ACHIEVEMENTS UNLOCKED card ----
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.achievements.svg
          token: ${{ secrets.MCP_METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 10

      # ---- 3: STARGRAZERS / REACH card ----
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.stargazers.svg
          token: ${{ secrets.MCP_METRICS_TOKEN }}
          base: metadata, repositories
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: last
          plugin_stargazers_days: 180

      # ---- 4: TOPICS / AI+SEC mapping card ----
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.topics.svg
          token: ${{ secrets.MCP_METRICS_TOKEN }}
          base: repositories
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_sort: stars
          plugin_topics_limit: 0